name: Live reproducibility check

on:
  workflow_dispatch:
    inputs:
      substrate_rpc:
        description: Moonbeam Substrate RPC URL
        required: true
        type: string
      evm_rpc:
        description: Moonbeam EVM RPC URL
        required: true
        type: string
      block_hash:
        description: Explicit pinned Moonbeam block hash
        required: true
        type: string

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node dist/cli/index.js probe --rpc "${{ inputs.substrate_rpc }}"
      - run: node dist/cli/index.js inspect --rpc "${{ inputs.substrate_rpc }}" --block-hash "${{ inputs.block_hash }}"
      - run: node dist/cli/index.js snapshot --rpc "${{ inputs.substrate_rpc }}" --evm-rpc "${{ inputs.evm_rpc }}" --block-hash "${{ inputs.block_hash }}" --out snapshots
      - run: node dist/cli/index.js verify --rpc "${{ inputs.substrate_rpc }}" --snapshot "$(find snapshots -mindepth 1 -maxdepth 1 -type d | head -1)"
