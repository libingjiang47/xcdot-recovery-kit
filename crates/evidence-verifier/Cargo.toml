[package]
name = "evidence-verifier"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Offline verifier for xcDOT evidence bundles"

[[bin]]
name = "evidence-verifier"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
hex = "0.4.3"
parity-scale-codec = "3.7.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
sp-core = "43.0.0"
sp-trie = "46.0.0"
